<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>PhyAR Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --green: #23a05a; --green-d: #157a40; --green-l: #dff5e6; --bg: #2e8f4a;
      --navy: #17233d; --yellow: #ffd23f; --white: #ffffff; --red: #e2453f;
    }
    /* No page background: the live camera sits behind the page and must stay visible. */
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: transparent;
      font-family: "Baloo 2", system-ui, sans-serif; color: var(--navy);
      -webkit-user-select: none; user-select: none; touch-action: none;
    }
    button { font-family: inherit; cursor: pointer; }

    /* ---------- start screen ---------- */
    #start { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
      align-items: center; overflow: hidden; text-align: center; background: var(--bg); color: var(--white); }
    #start .cover { position: relative; width: 100%; max-width: 560px; flex: 0 1 auto; }
    #start .cover img { display: block; width: 100%; max-height: 66vh; object-fit: cover;
      object-position: top center; animation: rise .7s ease-out both; }
    #start .cover::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 90px;
      background: linear-gradient(rgba(46,143,74,0), var(--bg)); }
    #start .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 8px 20px max(18px, env(safe-area-inset-bottom)); margin-top: -40px; position: relative; z-index: 1; }
    #start .sub { font-size: 18px; font-weight: 700; text-shadow: 0 2px 0 rgba(23,35,61,.35); }
    .big { font-size: 22px; font-weight: 800; color: var(--navy); padding: 10px 36px;
      border: 4px solid var(--navy); border-radius: 999px; background: var(--yellow); box-shadow: 0 6px 0 var(--navy); }
    .big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--navy); }
    #startBtn { font-size: 24px; animation: beat 1.8s ease-in-out infinite; }
    #collectionBtn { font-size: 16px; font-weight: 700; color: var(--white); background: rgba(23,35,61,.35);
      border: 2px solid rgba(255,255,255,.7); border-radius: 999px; padding: 6px 18px; }
    #start .note { font-size: 13px; opacity: .9; }
    @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    /* ---------- in-AR interface ---------- */
    .pill { position: fixed; z-index: 20; padding: 6px 16px; border-radius: 999px; font-weight: 700;
      white-space: nowrap; border: 3px solid var(--navy); box-shadow: 0 4px 0 rgba(23,35,61,.35);
      transition: opacity .3s; }
    .center { left: 50%; transform: translateX(-50%); }
    .hidden { opacity: 0 !important; pointer-events: none !important; }
    #progress { top: max(14px, env(safe-area-inset-top)); left: 14px; background: var(--white); font-size: 15px; color: var(--navy); }
    #title { top: max(60px, calc(env(safe-area-inset-top) + 46px)); background: var(--white); font-size: 17px;
      max-width: calc(100% - 40px); overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    #hint { bottom: 110px; background: var(--green); color: var(--white); font-size: 16px; pointer-events: none; }
    #loading { top: 46%; background: var(--white); font-size: 16px; pointer-events: none; }
    #loading::before { content: ""; display: inline-block; width: 14px; height: 14px; margin-right: 8px;
      border: 3px solid var(--green); border-top-color: transparent; border-radius: 50%;
      vertical-align: -2px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #frame { position: fixed; z-index: 15; left: 50%; top: 46%; width: 56vw; max-width: 260px; aspect-ratio: 2 / 3;
      transform: translate(-50%, -50%); pointer-events: none; transition: opacity .3s; }
    #frame i { position: absolute; width: 34px; height: 34px; border: 6px solid var(--white);
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); animation: pulse 1.6s ease-in-out infinite; }
    #frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
    #frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 14px 0 0; }
    #frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 14px; }
    #frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

    #bar { position: fixed; z-index: 20; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom));
      display: flex; justify-content: center; gap: 12px; }
    .btn { width: 58px; height: 58px; border-radius: 50%; font-size: 24px; border: 4px solid var(--navy);
      background: var(--white); box-shadow: 0 5px 0 var(--navy); display: flex; align-items: center; justify-content: center; }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--navy); }
    .btn.on { background: var(--yellow); }
    #resetBtn, #quizBtn, #labelBtn { display: none; }

    /* temperature slider */
    #simPanel { position: fixed; z-index: 21; left: 50%; transform: translateX(-50%);
      bottom: calc(max(18px, env(safe-area-inset-bottom)) + 74px); width: min(92vw, 420px);
      background: var(--white); border: 3px solid var(--navy); border-radius: 20px;
      box-shadow: 0 5px 0 rgba(23,35,61,.35); padding: 8px 16px 10px; box-sizing: border-box; transition: opacity .3s; }
    #simPanel .row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
    #simPanel .val { font-size: 22px; font-weight: 800; color: var(--red); }
    #simPanel .small { font-size: 13px; color: #45506a; line-height: 1.25; }
    #dT { width: 100%; height: 34px; accent-color: var(--red); margin: 2px 0; }

    /* hotspots */
    #hotspots { position: fixed; inset: 0; z-index: 18; pointer-events: none; }
    .hotspot { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
      background: var(--yellow); border: 3px solid var(--navy); pointer-events: auto; padding: 0;
      font-size: 15px; font-weight: 800; color: var(--navy); }
    .hotspot::after { content: ""; position: absolute; inset: -8px; border-radius: 50%;
      border: 3px solid var(--yellow); animation: ring 1.6s ease-out infinite; }
    @keyframes ring { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
    .hotspot.seen { background: var(--white); }
    .hotspot.seen::after { display: none; }
    #bubble { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); top: 20%;
      width: min(86vw, 360px); box-sizing: border-box; background: var(--white); border: 3px solid var(--navy);
      border-radius: 18px; padding: 12px 16px; box-shadow: 0 6px 0 rgba(23,35,61,.35); transition: opacity .25s; }
    #bubble b { display: block; font-size: 19px; color: var(--green-d); }
    #bubble p { margin: 4px 0 0; font-size: 15px; line-height: 1.35; }

    /* bottom sheet (POE + quiz) */
    #sheet { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; max-height: 78vh; overflow-y: auto;
      background: var(--white); border-radius: 26px 26px 0 0; border-top: 4px solid var(--navy);
      padding: 18px 18px max(20px, env(safe-area-inset-bottom)); box-sizing: border-box;
      box-shadow: 0 -8px 24px rgba(0,0,0,.25); transition: transform .35s cubic-bezier(.2,1.3,.4,1); }
    #sheet.closed { transform: translateY(110%); }
    #sheet .tag { display: inline-block; font-size: 13px; font-weight: 800; color: var(--white);
      background: var(--green); border-radius: 999px; padding: 2px 12px; }
    #sheet h3 { margin: 8px 0 12px; font-size: 20px; line-height: 1.25; }
    #sheet p { margin: 6px 0 12px; font-size: 16px; line-height: 1.4; }
    .opt { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 10px 14px; font-size: 16px;
      font-weight: 700; color: var(--navy); background: var(--green-l); border: 3px solid var(--navy);
      border-radius: 14px; box-shadow: 0 4px 0 var(--navy); }
    .opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--navy); }
    .opt.right { background: #b9f0c8; } .opt.wrong { background: #ffd0cc; }
    .next { margin-top: 6px; width: 100%; }
    .stars { font-size: 32px; letter-spacing: 4px; }

    /* toast + collection */
    #toast { position: fixed; z-index: 70; left: 50%; top: 18%; transform: translateX(-50%) scale(.8);
      background: var(--yellow); border: 4px solid var(--navy); border-radius: 22px; padding: 12px 20px;
      text-align: center; font-weight: 800; font-size: 18px; box-shadow: 0 6px 0 var(--navy);
      opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
    #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
    #toast .em { font-size: 40px; display: block; }

    #collection { position: fixed; z-index: 60; inset: 0; background: rgba(23,35,61,.55);
      display: flex; align-items: flex-end; justify-content: center; transition: opacity .25s; }
    #collection .box { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--white);
      border-radius: 26px 26px 0 0; border-top: 4px solid var(--navy); padding: 16px 16px 24px; box-sizing: border-box; }
    #collection h3 { margin: 0 0 4px; font-size: 22px; }
    #collection .bar { height: 14px; border-radius: 7px; background: var(--green-l); border: 2px solid var(--navy); overflow: hidden; }
    #collection .bar i { display: block; height: 100%; background: var(--green); }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
    .slot { aspect-ratio: 2 / 3; border-radius: 12px; border: 3px solid var(--navy); background: #eef1f5;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px;
      text-align: center; font-size: 11px; font-weight: 700; line-height: 1.1; color: #7b8496; overflow: hidden; }
    .slot .n { font-size: 20px; font-weight: 800; }
    .slot.found { background: var(--green-l); color: var(--navy); }
    .slot.found .n { color: var(--green-d); }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 2px solid var(--navy); background: var(--yellow); }
    .badge.locked { background: #eef1f5; color: #7b8496; border-color: #c9d0da; }
  </style>

  <script>
    /* ==================================================================
       TETAPAN KAD  (edit di sini sahaja)
       Susunan mesti SAMA dengan susunan gambar semasa compile phyar-16-kad.mind

       title  : tajuk kad                     topic : subtopik (untuk lencana)
       video  : fail video ("" jika tiada)    key   : "green" | "black" | "none"
       model  : fail 3D .glb ("" jika tiada)  motion: "none" | "bob" | "spin" | "slide"
       scale/y: saiz & kedudukan video atas kad
       sim    : simulasi interaktif dengan gelongsor suhu (kad pembiasan siang)
       poe    : soalan Ramal-Perhati-Terang sebelum animasi (null jika tiada)
       labels : titik maklumat di atas kad. x: -0.5 (kiri) hingga 0.5 (kanan),
                y: -0.75 (bawah) hingga 0.75 (atas)
       quiz   : soalan kuiz selepas animasi ([] jika tiada)
       ================================================================== */
    const blank = (n) => ({ title: "Kad " + n, topic: "", video: "video-" + String(n).padStart(2, "0") + ".mp4",
      key: "black", model: "", motion: "none", scale: 1, y: 0.05, sim: null, poe: null, labels: [], quiz: [] });

    const CARDS = [
      blank(1), blank(2), blank(3), blank(4), blank(5), blank(6), blank(7), blank(8),
      blank(9), blank(10), blank(11), blank(12),

      /* ---------- KAD 13: contoh lengkap ---------- */
      {
        title: "Pembiasan Bunyi · Waktu Siang",
        topic: "Pembiasan",
        video: "",                 // tiada video: kad ini guna simulasi interaktif di bawah
        key: "none", model: "", motion: "none", scale: 1, y: 0.05,
        sim: {
          src: [-0.27, 0.027],     // kedudukan muncung kereta api pada kad
          ground: -0.114,          // garis tanah pada kad
          top: 0.30,               // had atas kawasan gambar
          right: 0.47,             // had kanan kawasan gambar
          startDT: 10,             // beza suhu permulaan (°C)
        },
        poe: {
          q: "Pada waktu siang, udara dekat tanah lebih panas. Ke manakah arah bunyi kereta api akan bergerak?",
          options: ["⬆️ Membengkok ke atas, menjauhi tanah", "⬇️ Membengkok ke bawah, ke arah tanah", "➡️ Bergerak lurus, tidak berubah"],
          answer: 0,
          explain: "Bunyi bergerak lebih laju dalam udara panas. Bahagian muka gelombang yang dekat tanah bergerak lebih laju, jadi muka gelombang condong dan bunyi dibiaskan menjauhi tanah. Sebab itu bunyi kurang jelas kepada pemerhati di rumah.",
        },
        labels: [
          { x: 0.02, y: -0.095, text: "Udara panas", info: "Lapisan udara dekat tanah dipanaskan oleh Matahari. Bunyi bergerak lebih laju di sini." },
          { x: -0.08, y: 0.26, text: "Udara sejuk", info: "Udara di atas lebih sejuk, jadi bunyi bergerak lebih perlahan." },
          { x: -0.15, y: 0.07, text: "Muka gelombang", info: "Garis yang menyambungkan titik-titik bunyi yang sama fasa. Perhatikan ia condong ke atas." },
          { x: 0.10, y: 0.16, text: "Arah perambatan", info: "Sentiasa berserenjang dengan muka gelombang. Pada waktu siang ia membengkok menjauhi tanah." },
          { x: 0.29, y: -0.02, text: "Pemerhati", info: "Bunyi yang sampai ke rumah kurang jelas kerana banyak bunyi dibiaskan ke atas." },
        ],
        quiz: [
          { q: "Mengapakah bunyi bergerak lebih laju dekat tanah pada waktu siang?",
            options: ["Udara dekat tanah lebih panas", "Udara dekat tanah lebih tumpat", "Tanah memantulkan bunyi"],
            answer: 0, explain: "Halaju bunyi bertambah apabila suhu udara meningkat." },
          { q: "Apakah yang berlaku kepada arah perambatan bunyi pada waktu siang?",
            options: ["Dibiaskan menjauhi tanah", "Dibiaskan ke arah tanah", "Dipantulkan oleh tanah"],
            answer: 0, explain: "Bunyi membengkok ke arah udara yang lebih sejuk, iaitu ke atas." },
          { q: "Jika beza suhu antara tanah dan udara di atas bertambah, pembiasan bunyi akan…",
            options: ["Bertambah", "Berkurang", "Tidak berubah"],
            answer: 0, explain: "Cuba gelongsor suhu! Beza suhu yang lebih besar menjadikan pembiasan lebih ketara." },
        ],
      },

      /* ---------- KAD 14: Pembiasan Bunyi · Waktu Malam ----------
         (Jika kad malam bukan kad ke-14 dalam fail .mind, pindahkan blok ini
          ke kedudukan yang betul dan letakkan blank(14) di sini.) */
      {
        title: "Pembiasan Bunyi · Waktu Malam",
        topic: "Pembiasan",
        video: "",                 // tiada video: kad ini guna simulasi interaktif di bawah
        key: "none", model: "", motion: "none", scale: 1, y: 0.05,
        sim: {
          mode: "malam",
          src: [-0.256, 0.145],    // kedudukan muncung kereta api pada kad malam
          ground: -0.036,          // garis tanah
          top: 0.364,              // had atas kawasan gambar
          right: 0.467,            // had kanan kawasan gambar
          target: [0.174, 0.076],  // titik di rumah yang dituju anak panah
          startDT: 10,
        },
        poe: {
          q: "Pada waktu malam, udara dekat tanah lebih sejuk daripada udara di atas. Ke manakah arah bunyi kereta api akan bergerak?",
          options: ["⬆️ Membengkok ke atas, menjauhi tanah", "⬇️ Membengkok ke bawah, ke arah tanah", "➡️ Bergerak lurus, tidak berubah"],
          answer: 1,
          explain: "Bunyi bergerak lebih perlahan dalam udara sejuk dekat tanah. Bahagian atas muka gelombang berada dalam udara yang lebih panas, jadi ia bergerak lebih laju. Muka gelombang condong ke bawah dan bunyi dibiaskan ke arah tanah. Sebab itu bunyi kereta api lebih jelas didengar pada waktu malam.",
        },
        labels: [
          { x: 0.0, y: -0.015, text: "Udara sejuk", info: "Pada waktu malam tanah cepat menyejuk, jadi lapisan udara dekat tanah lebih sejuk. Bunyi bergerak lebih perlahan di sini." },
          { x: 0.12, y: 0.32, text: "Udara panas", info: "Udara di atas lebih panas, jadi bunyi bergerak lebih laju di bahagian atas." },
          { x: -0.06, y: 0.24, text: "Muka gelombang", info: "Bahagian atas muka gelombang bergerak lebih laju, jadi muka gelombang condong ke arah tanah." },
          { x: -0.03, y: 0.15, text: "Arah perambatan", info: "Sentiasa berserenjang dengan muka gelombang. Pada waktu malam ia membengkok ke arah tanah." },
          { x: 0.27, y: 0.047, text: "Pemerhati", info: "Bunyi yang dibiaskan ke arah tanah sampai ke rumah, jadi bunyi kereta api jelas didengar." },
        ],
        quiz: [
          { q: "Mengapakah bunyi kereta api lebih jelas didengar pada waktu malam?",
            options: ["Bunyi dibiaskan ke arah tanah", "Bunyi bergerak lebih laju dekat tanah", "Udara malam tiada angin"],
            answer: 0, explain: "Bunyi membengkok ke bawah, ke arah pemerhati di atas tanah." },
          { q: "Pada waktu malam, di manakah bunyi bergerak paling laju?",
            options: ["Dalam udara panas di atas", "Dalam udara sejuk dekat tanah", "Sama laju di semua tempat"],
            answer: 0, explain: "Halaju bunyi lebih tinggi dalam udara yang lebih panas." },
          { q: "Apakah perbezaan utama pembiasan bunyi pada waktu siang dan malam?",
            options: ["Siang: menjauhi tanah · Malam: ke arah tanah", "Siang: ke arah tanah · Malam: menjauhi tanah", "Tiada perbezaan"],
            answer: 0, explain: "Bunyi sentiasa membengkok ke arah udara yang lebih sejuk: ke atas pada siang, ke bawah pada malam." },
        ],
      },

      blank(15), blank(16),
    ];

    const GREEN_CUT = 0.08;   // naikkan jika latar hijau masih kelihatan
    const BLACK_CUT = 0.07;   // naikkan jika latar hitam masih kelihatan
    const MODEL_SIZE = 0.8;   // saiz model 3D berbanding lebar kad

    /* ---------- saved progress (kept on this phone only) ---------- */
    const store = {
      get(k, d) { try { const v = localStorage.getItem("phyar_" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem("phyar_" + k, JSON.stringify(v)); } catch (e) {} },
    };
    const progress = { found: store.get("found", []), stars: store.get("stars", {}) };
    const TOPICS = [...new Set(CARDS.map((c) => c.topic).filter(Boolean))];
    const totalStars = () => Object.values(progress.stars).reduce((a, b) => a + b, 0);
    const topicDone = (t) => CARDS.every((c, i) => c.topic !== t || progress.found.includes(i));

    function saveProgress() { store.set("found", progress.found); store.set("stars", progress.stars); updateProgressUI(); }
    function addStars(cardIndex, key, n) {
      const k = cardIndex + ":" + key;
      if ((progress.stars[k] || 0) < n) { progress.stars[k] = n; saveProgress(); }
    }
    function markFound(i) {
      if (progress.found.includes(i)) return;
      const before = TOPICS.filter(topicDone);
      progress.found.push(i);
      saveProgress();
      const newBadge = TOPICS.find((t) => topicDone(t) && !before.includes(t));
      if (newBadge) toast("🏅", "Lencana baru!<br>Pakar " + newBadge);
      else toast("🃏", "Kad baru dijumpai! " + progress.found.length + "/" + CARDS.length);
    }

    /* ---------- interface helpers ---------- */
    const UI = {};
    let soundOn = true, activeCard = null, labelsOn = true;
    const allVideos = [];
    function setTitle(t) { UI.title.textContent = t || ""; UI.title.classList.toggle("hidden", !t); }
    function setLoading(on) { UI.loading.classList.toggle("hidden", !on); }
    function setScanning(on) { UI.hint.classList.toggle("hidden", !on); UI.frame.style.opacity = on ? 1 : 0; }
    let toastTimer;
    function toast(em, html) {
      UI.toast.innerHTML = '<span class="em">' + em + "</span>" + html;
      UI.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => UI.toast.classList.remove("show"), 2200);
    }
    function updateProgressUI() {
      if (!UI.progress) return;
      UI.progress.textContent = "🃏 " + progress.found.length + "/" + CARDS.length + "  ⭐ " + totalStars();
      UI.collectionBtn.textContent = "🃏 Koleksi Saya (" + progress.found.length + "/" + CARDS.length + ")";
    }
    function openSheet(html) { UI.sheet.innerHTML = html; UI.sheet.classList.remove("closed"); }
    function closeSheet() { UI.sheet.classList.add("closed"); }

    /* ---------- video shader (green/black removal + rounded corners) ---------- */
    const VERT = `varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
    const FRAG = `uniform sampler2D map; uniform float keyMode, greenCut, blackCut, aspect;
      varying vec2 vUv;
      void main() {
        vec4 c = texture2D(map, vUv); float a = 1.0;
        if (keyMode > 0.5 && keyMode < 1.5) { float g = c.g - max(c.r, c.b);
          a = 1.0 - smoothstep(greenCut, greenCut + 0.12, g); if (g > 0.0) c.g = mix(c.g, max(c.r, c.b), 0.85); }
        else if (keyMode > 1.5) { float l = max(c.r, max(c.g, c.b)); a = smoothstep(blackCut, blackCut + 0.10, l); }
        vec2 p = abs(vUv - 0.5) * vec2(aspect, 1.0); vec2 h = vec2(aspect, 1.0) * 0.5 - 0.06;
        a *= 1.0 - smoothstep(-0.004, 0.004, length(max(p - h, 0.0)) - 0.06);
        if (a < 0.02) discard; gl_FragColor = vec4(c.rgb, a);
      }`;
    const easeOutBack = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

    /* ==================================================================
       Interactive simulation: sound refraction in a temperature gradient.
       Sound speed falls with height, v(h) = v0 - g*h. For a linear gradient
       every wavefront is an exact circle whose centre drifts, and every ray
       is a circular arc, so the bending shown is physically correct.
       ================================================================== */
    function makeRefractionSim(cfg, group) {
      const S = 0.1;                          // card units per simulation unit
      const sx = cfg.src[0], sy = cfg.src[1], G0 = cfg.ground;
      const HS = (sy - G0) / S;               // source height above the ground
      const N = 6, SEG = 64, PERIOD = 4.0, W = 0.009;
      const RMAX = (cfg.right - sx) / S + 1.5;
      const night = cfg.mode === "malam";     // night: cool ground, warmer air above
      const sim = { dT: cfg.startDT, clock: 0, night };
      const mkMat = (col) => new THREE.MeshBasicMaterial({ color: col, transparent: true, depthWrite: false, side: THREE.DoubleSide });

      // warm air band: stronger colour when the ground is hotter
      const bandMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, uniforms: { k: { value: 0 } }, vertexShader: VERT,
        fragmentShader: `uniform float k; varying vec2 vUv;
          void main() { gl_FragColor = vec4(` + (night ? "0.35, 0.75, 1.0" : "1.0, 0.55, 0.15") + `, (1.0 - vUv.y) * k); }`,
      });
      const band = new THREE.Mesh(new THREE.PlaneGeometry(cfg.right + 0.47, 0.07), bandMat);
      band.position.set((cfg.right - 0.47) / 2, G0 + 0.035, 0.003);
      group.add(band);

      // wavefronts: fixed-size ribbons whose vertices are recomputed each frame
      const fronts = [];
      for (let i = 0; i < N; i++) {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(SEG * 6 * 3), 3));
        const mesh = new THREE.Mesh(geo, mkMat(0x18d3ff));
        mesh.position.z = 0.006; mesh.frustumCulled = false;
        group.add(mesh); fronts.push(mesh);
      }
      const rayMesh = new THREE.Mesh(new THREE.BufferGeometry(), mkMat(0xff3b30));
      const head = new THREE.Mesh(new THREE.BufferGeometry(), mkMat(0xff3b30));
      [rayMesh, head].forEach((m) => { m.position.z = 0.008; m.frustumCulled = false; group.add(m); });

      // speed gradient (exaggerated so the bending is visible); negative at night = speed grows with height
      const gOf = () => (night ? -1 : 1) * 0.011 * sim.dT;
      const front = (t, g) => {
        if (Math.abs(g) < 1e-4) return [HS, t];
        const A = 1 / g - HS;
        return [1 / g - A * Math.cosh(g * t), A * Math.sinh(g * t)];
      };
      const tMax = (g) => (Math.abs(g) < 1e-4 ? RMAX : Math.asinh(RMAX / (1 / g - HS)) / g);
      const inside = (x, y) => y >= G0 && y <= cfg.top && x <= cfg.right;

      function buildRay() {
        const g = gOf(), pts = [];
        if (night) {
          // night: the ray arcs over and comes down onto the house (circle through source and target)
          const X = (cfg.target[0] - sx) / S, Z = (cfg.target[1] - G0) / S;
          if (Math.abs(g) < 1e-4) {
            for (let i = 0; i <= 60; i++) pts.push([sx + X * S * i / 60, G0 + (HS + (Z - HS) * i / 60) * S]);
          } else {
            const hc = 1 / g;                // circle centre is below the ground
            const cx = (X * X + (Z - hc) ** 2 - (HS - hc) ** 2) / (2 * X);
            const r = Math.hypot(cx, HS - hc);
            const a0 = Math.atan2(HS - hc, -cx), a1 = Math.atan2(Z - hc, X - cx);
            for (let i = 0; i <= 80; i++) {
              const a = a0 + (a1 - a0) * i / 80;
              pts.push([sx + (cx + r * Math.cos(a)) * S, G0 + (hc + r * Math.sin(a)) * S]);
            }
          }
        } else if (g < 1e-4) {
          for (let x = 0; sx + x * S <= cfg.right - 0.04; x += 0.1) pts.push([sx + x * S, sy]);
        } else {
          const hc = 1 / g, r = hc - HS;     // ray = circle centred where the speed would be zero
          for (let ph = 0; ph < 1.5; ph += 0.01) {
            const x = sx + r * Math.sin(ph) * S, y = G0 + (hc - r * Math.cos(ph)) * S;
            if (!inside(x, y) || x > cfg.right - 0.04) break;
            pts.push([x, y]);
          }
        }
        const v = [], w = 0.0075;
        for (let i = 0; i < pts.length - 1; i++) {
          const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
          const L = Math.hypot(x2 - x1, y2 - y1) || 1, nx = -(y2 - y1) / L * w / 2, ny = (x2 - x1) / L * w / 2;
          v.push(x1 + nx, y1 + ny, 0, x1 - nx, y1 - ny, 0, x2 + nx, y2 + ny, 0,
                 x2 + nx, y2 + ny, 0, x1 - nx, y1 - ny, 0, x2 - nx, y2 - ny, 0);
        }
        rayMesh.geometry.dispose();
        rayMesh.geometry = new THREE.BufferGeometry();
        rayMesh.geometry.setAttribute("position", new THREE.Float32BufferAttribute(v, 3));
        const n = pts.length, [ex, ey] = pts[n - 1], [px, py] = pts[Math.max(0, n - 4)];
        const L = Math.hypot(ex - px, ey - py) || 1, ux = (ex - px) / L, uy = (ey - py) / L, s = 0.03;
        head.geometry.dispose();
        head.geometry = new THREE.BufferGeometry();
        head.geometry.setAttribute("position", new THREE.Float32BufferAttribute([
          ex + ux * s, ey + uy * s, 0, ex - uy * s * 0.6, ey + ux * s * 0.6, 0, ex + uy * s * 0.6, ey - ux * s * 0.6, 0], 3));
        bandMat.uniforms.k.value = 0.5 * sim.dT / 15;
      }

      sim.setDT = (v) => { sim.dT = v; buildRay(); };
      sim.update = (sec) => {
        sim.clock += sec;
        const g = gOf(), T = tMax(g);
        fronts.forEach((mesh, i) => {
          const phase = ((sim.clock / PERIOD) + i / N) % 1;
          const [hc, R] = front(phase * T, g);
          const arr = mesh.geometry.attributes.position.array;
          const rIn = Math.max(R - W / 2 / S, 0.001), rOut = R + W / 2 / S;
          const P = (r, th) => [sx + r * Math.cos(th) * S, G0 + (hc + r * Math.sin(th)) * S];
          let k = 0;
          for (let j = 0; j < SEG; j++) {
            const t1 = -Math.PI / 2 + Math.PI * j / SEG, t2 = -Math.PI / 2 + Math.PI * (j + 1) / SEG;
            const a = P(rIn, t1), b = P(rOut, t1), c = P(rIn, t2), d = P(rOut, t2);
            const ok = inside(a[0], a[1]) && inside(b[0], b[1]) && inside(c[0], c[1]) && inside(d[0], d[1]);
            const q = ok ? [a, b, c, c, b, d] : [a, a, a, a, a, a];
            for (const p of q) { arr[k++] = p[0]; arr[k++] = p[1]; arr[k++] = 0; }
          }
          mesh.geometry.attributes.position.needsUpdate = true;
          mesh.material.opacity = Math.min(1, phase / 0.06) * Math.min(1, (1 - phase) / 0.25) * 0.95;
        });
      };
      buildRay();
      return sim;
    }

    /* ==================================================================
       One component per card: video / model / simulation / labels / POE / quiz
       ================================================================== */
    AFRAME.registerComponent("phyar-card", {
      schema: { index: { type: "int" } },

      init: function () {
        this.idx = this.data.index;
        this.cfg = CARDS[this.idx] || {};
        this.visible = false; this.popT = 1; this.userRot = 0; this.userScale = 1; this.clock = 0;
        this.poeState = this.cfg.poe ? "ask" : "done";
        this.holder = new THREE.Group(); this.holder.visible = false;
        this.el.object3D.add(this.holder);

        if (this.cfg.video) this.buildVideo();
        if (this.cfg.model) { this.turn = new THREE.Group(); this.holder.add(this.turn); }
        if (this.cfg.sim) { const g = new THREE.Group(); this.holder.add(g); this.sim = makeRefractionSim(this.cfg.sim, g); }

        this.hotspots = (this.cfg.labels || []).map((lab) => {
          const b = document.createElement("button");
          b.className = "hotspot hidden"; b.textContent = "i";
          b.addEventListener("click", () => {
            b.classList.add("seen");
            UI.bubble.innerHTML = "<b>" + lab.text + "</b><p>" + lab.info + "</p>";
            UI.bubble.classList.remove("hidden");
            clearTimeout(this.bubbleTimer);
            this.bubbleTimer = setTimeout(() => UI.bubble.classList.add("hidden"), 6000);
          });
          UI.hotspots.appendChild(b);
          return { el: b, pos: new THREE.Vector3(lab.x, lab.y, 0.01) };
        });
        this.tmpV = new THREE.Vector3();

        this.el.addEventListener("targetFound", () => this.onFound());
        this.el.addEventListener("targetLost", () => this.onLost());
      },

      buildVideo: function () {
        const cfg = this.cfg, v = document.createElement("video");
        v.src = cfg.video; v.loop = true; v.muted = !soundOn; v.playsInline = true;
        v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
        v.crossOrigin = "anonymous"; v.preload = "none";
        allVideos.push(v); this.video = v;
        const tex = new THREE.VideoTexture(v);
        tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false;
        const keyMode = cfg.key === "green" ? 1 : cfg.key === "black" ? 2 : 0;
        this.vmat = new THREE.ShaderMaterial({
          transparent: true, side: THREE.DoubleSide, depthWrite: false,
          uniforms: { map: { value: tex }, keyMode: { value: keyMode }, greenCut: { value: GREEN_CUT },
                      blackCut: { value: BLACK_CUT }, aspect: { value: 16 / 9 } },
          vertexShader: VERT, fragmentShader: FRAG,
        });
        this.vplane = new THREE.Mesh(new THREE.PlaneGeometry(1, 9 / 16), this.vmat);
        this.vplane.position.set(0, cfg.y || 0, 0.005);
        this.vbase = cfg.scale || 1;
        this.holder.add(this.vplane);
        v.addEventListener("loadedmetadata", () => {
          if (!v.videoWidth) return;
          const asp = v.videoWidth / v.videoHeight;
          this.vplane.geometry.dispose();
          this.vplane.geometry = new THREE.PlaneGeometry(1, 1 / asp);
          this.vmat.uniforms.aspect.value = asp;
        });
        v.addEventListener("waiting", () => { if (this.visible) setLoading(true); });
        v.addEventListener("playing", () => setLoading(false));
      },

      loadModel: function () {
        if (this.modelLoading || this.model) return;
        this.modelLoading = true; setLoading(true);
        new THREE.GLTFLoader().load(this.cfg.model, (gltf) => {
          const m = gltf.scene, box = new THREE.Box3().setFromObject(m);
          const size = new THREE.Vector3(), c = new THREE.Vector3(); box.getSize(size); box.getCenter(c);
          const s = MODEL_SIZE / Math.max(size.x, size.z, 0.0001);
          m.position.set(-c.x * s, -box.min.y * s, -c.z * s); m.scale.setScalar(s);
          const stand = new THREE.Group(); stand.rotation.x = Math.PI / 2; stand.add(m); this.turn.add(stand);
          if (gltf.animations && gltf.animations.length) {
            this.mixer = new THREE.AnimationMixer(m);
            gltf.animations.forEach((clip) => this.mixer.clipAction(clip).play());
          }
          this.model = m; setLoading(false);
        }, undefined, (err) => { console.error("Model gagal dimuat:", this.cfg.model, err); setLoading(false); });
      },

      /* content stays hidden while the student is still making a prediction */
      showContent: function () {
        const on = this.visible && this.poeState !== "ask";
        if (on && !this.holder.visible) this.popT = 0;
        this.holder.visible = on;
        if (this.video) { if (on) { this.video.muted = !soundOn; this.video.play().catch(() => {}); } else this.video.pause(); }
        if (on && this.cfg.model) this.loadModel();
        this.updateButtons();
      },

      updateButtons: function () {
        const on = activeCard === this && this.holder.visible;
        if (activeCard !== this && activeCard) return;
        UI.resetBtn.style.display = on && this.cfg.model ? "flex" : "none";
        UI.quizBtn.style.display = on && this.cfg.quiz && this.cfg.quiz.length ? "flex" : "none";
        UI.labelBtn.style.display = on && this.hotspots.length ? "flex" : "none";
        UI.simPanel.classList.toggle("hidden", !(on && this.sim));
        if (on && this.sim) { UI.dT.value = this.sim.dT; updateSimText(this.sim.dT); }
      },

      onFound: function () {
        this.visible = true; activeCard = this;
        setScanning(false); setTitle(this.cfg.title);
        markFound(this.idx);
        if (this.poeState === "ask" && UI.sheet.classList.contains("closed")) this.askPOE();
        this.showContent();
      },

      onLost: function () {
        this.visible = false;
        this.hotspots.forEach((h) => h.el.classList.add("hidden"));
        this.showContent();
        if (activeCard === this) {
          activeCard = null; setTitle(""); setLoading(false); setScanning(true);
          UI.bubble.classList.add("hidden");
          this.updateButtons();
        }
      },

      /* ---------- Predict → Observe → Explain ---------- */
      askPOE: function () {
        const p = this.cfg.poe;
        openSheet('<span class="tag">🤔 RAMAL</span><h3>' + p.q + "</h3>" +
          p.options.map((o, i) => '<button class="opt" data-i="' + i + '">' + o + "</button>").join(""));
        UI.sheet.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
          this.prediction = +b.dataset.i;
          this.poeState = "watch";
          closeSheet();
          toast("👀", "PERHATI<br>Lihat apa yang berlaku!");
          this.showContent();
          clearTimeout(this.poeTimer);
          this.poeTimer = setTimeout(() => this.explainPOE(), 7000);
        }));
      },
      explainPOE: function () {
        const p = this.cfg.poe, right = this.prediction === p.answer;
        if (right) addStars(this.idx, "poe", 1);
        openSheet('<span class="tag">💡 TERANG</span><h3>' + (right ? "Ramalan anda betul! 🎉" : "Hmm, perhatikan semula 🤔") + "</h3>" +
          "<p><b>Jawapan:</b> " + p.options[p.answer] + "</p><p>" + p.explain + "</p>" +
          (this.sim ? "<p>🌡️ Cuba gelongsor suhu dan lihat perubahannya!</p>" : "") +
          '<button class="big next">Teruskan</button>');
        UI.sheet.querySelector(".next").addEventListener("click", () => { this.poeState = "done"; closeSheet(); });
      },

      /* ---------- quiz ---------- */
      startQuiz: function () {
        const qs = this.cfg.quiz; let n = 0, score = 0;
        const show = () => {
          if (n >= qs.length) {
            addStars(this.idx, "quiz", score);
            openSheet('<span class="tag">⭐ KUIZ</span><h3>Tahniah!</h3><div class="stars">' +
              "⭐".repeat(score) + "☆".repeat(qs.length - score) + "</div><p>Anda dapat " + score + "/" + qs.length + ".</p>" +
              '<button class="big next">Tutup</button>');
            UI.sheet.querySelector(".next").addEventListener("click", closeSheet);
            return;
          }
          const q = qs[n];
          openSheet('<span class="tag">⭐ KUIZ ' + (n + 1) + "/" + qs.length + "</span><h3>" + q.q + "</h3>" +
            q.options.map((o, i) => '<button class="opt" data-i="' + i + '">' + o + "</button>").join("") + '<div class="fb"></div>');
          const opts = UI.sheet.querySelectorAll(".opt");
          opts.forEach((b) => b.addEventListener("click", () => {
            const ok = +b.dataset.i === q.answer;
            if (ok) score++;
            opts.forEach((o) => { o.disabled = true; if (+o.dataset.i === q.answer) o.classList.add("right"); });
            if (!ok) b.classList.add("wrong");
            UI.sheet.querySelector(".fb").innerHTML = "<p>" + (ok ? "✅ Betul! " : "❌ Belum tepat. ") + q.explain + "</p>" +
              '<button class="big next">' + (n + 1 < qs.length ? "Seterusnya ▶" : "Lihat markah") + "</button>";
            UI.sheet.querySelector(".next").addEventListener("click", () => { n++; show(); });
          }));
        };
        show();
      },

      tick: function (t, dt) {
        if (!this.visible) return;
        const sec = Math.min((dt || 16) / 1000, 0.1);
        this.clock += sec;
        if (this.holder.visible) {
          if (this.popT < 1) {
            this.popT = Math.min(1, this.popT + sec / 0.45);
            this.holder.scale.setScalar(Math.max(0.001, easeOutBack(this.popT)));
          }
          if (this.vplane) this.vplane.scale.setScalar(this.vbase * this.userScale);
          if (this.sim) this.sim.update(sec);
          if (this.turn) {
            let rot = this.userRot, x = 0, lift = 0;
            if (this.cfg.motion === "spin") rot += this.clock * 0.8;
            if (this.cfg.motion === "bob") lift = 0.03 + Math.sin(this.clock * 3) * 0.03;
            if (this.cfg.motion === "slide") x = Math.sin(this.clock * 0.9) * 0.25;
            this.turn.rotation.z = rot; this.turn.position.set(x, 0, lift); this.turn.scale.setScalar(this.userScale);
          }
          if (this.mixer) this.mixer.update(sec);
        }
        // keep the tap-to-reveal dots glued to the card on screen
        const cam = this.el.sceneEl.camera, canvas = this.el.sceneEl.canvas;
        if (!cam || !canvas || !this.hotspots.length) return;
        const r = canvas.getBoundingClientRect(), showDots = labelsOn && this.holder.visible;
        this.el.object3D.updateMatrixWorld();
        this.hotspots.forEach((h) => {
          this.tmpV.copy(h.pos).applyMatrix4(this.el.object3D.matrixWorld).project(cam);
          const ok = showDots && this.tmpV.z < 1 && Math.abs(this.tmpV.x) < 1.1 && Math.abs(this.tmpV.y) < 1.1;
          h.el.classList.toggle("hidden", !ok);
          if (ok) {
            h.el.style.left = (r.left + (this.tmpV.x + 1) / 2 * r.width) + "px";
            h.el.style.top = (r.top + (1 - this.tmpV.y) / 2 * r.height) + "px";
          }
        });
      },
    });

    function updateSimText(v) {
      v = +v;
      const night = !!(activeCard && activeCard.sim && activeCard.sim.night);
      // day: hot ground, cooler air above · night: cool ground, warmer air above
      const tg = night ? 20 : 30 + v, ta = night ? 20 + v : 30, vg = 331 + 0.6 * tg, va = 331 + 0.6 * ta;
      UI.dTlabel.textContent = night ? "🌡️ Beza suhu udara atas – tanah" : "🌡️ Beza suhu tanah – udara";
      UI.dTval.textContent = v + " °C";
      UI.dTinfo.innerHTML = "Tanah " + tg + " °C → bunyi <b>" + vg.toFixed(0) + " m/s</b> · Atas " + ta +
        " °C → <b>" + va.toFixed(0) + " m/s</b>" + (v === 0 ? "<br>Tiada beza suhu: bunyi bergerak lurus." : "");
    }

    /* ---------- touch: drag to rotate models, pinch to zoom ---------- */
    (function () {
      const pts = new Map(); let lastX = 0, startDist = 0, startScale = 1;
      const isUI = (e) => e.target.closest && e.target.closest("button, input, #start, #sheet, #simPanel, #collection, #bubble");
      window.addEventListener("pointerdown", (e) => {
        if (isUI(e)) return;
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); lastX = e.clientX;
        if (pts.size === 2 && activeCard) {
          const [a, b] = [...pts.values()];
          startDist = Math.hypot(a.x - b.x, a.y - b.y); startScale = activeCard.userScale;
        }
      });
      window.addEventListener("pointermove", (e) => {
        if (!pts.has(e.pointerId)) return;
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (!activeCard) return;
        if (pts.size === 1 && activeCard.turn) { activeCard.userRot += (e.clientX - lastX) * 0.012; lastX = e.clientX; }
        else if (pts.size === 2 && startDist > 0) {
          const [a, b] = [...pts.values()];
          activeCard.userScale = Math.min(2.5, Math.max(0.5, startScale * Math.hypot(a.x - b.x, a.y - b.y) / startDist));
        }
      });
      const up = (e) => { pts.delete(e.pointerId); if (pts.size === 1) lastX = [...pts.values()][0].x; };
      window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
    })();
  </script>
</head>

<body>
  <!-- start screen -->
  <div id="start">
    <div class="cover"><img src="cover.jpg" alt="PhyAR Deck" /></div>
    <div class="panel">
      <div class="sub">Gelombang · Fizik Tingkatan 4</div>
      <button id="startBtn" class="big">Mula Imbas ▶</button>
      <button id="collectionBtn">🃏 Koleksi Saya</button>
      <div class="note">Benarkan akses kamera bila diminta 📷</div>
    </div>
  </div>

  <div id="frame"><i></i><i></i><i></i><i></i></div>
  <button id="progress" class="pill">🃏 0/16 ⭐ 0</button>
  <div id="title" class="pill center hidden"></div>
  <div id="loading" class="pill center hidden">Memuatkan…</div>
  <div id="hint" class="pill center">Halakan kamera ke kad PhyAR 📱</div>
  <div id="hotspots"></div>
  <div id="bubble" class="hidden"></div>

  <div id="simPanel" class="hidden">
    <div class="row"><span id="dTlabel">🌡️ Beza suhu tanah – udara</span><span id="dTval" class="val">10 °C</span></div>
    <input id="dT" type="range" min="0" max="15" step="1" value="10" />
    <div id="dTinfo" class="small"></div>
  </div>

  <div id="bar">
    <button id="soundBtn" class="btn on" aria-label="Bunyi">🔊</button>
    <button id="labelBtn" class="btn on" aria-label="Label">🏷️</button>
    <button id="quizBtn" class="btn" aria-label="Kuiz">⭐</button>
    <button id="resetBtn" class="btn" aria-label="Set semula">↺</button>
  </div>

  <div id="sheet" class="closed"></div>
  <div id="toast"></div>
  <div id="collection" class="hidden"><div class="box"></div></div>

  <a-scene
    mindar-image="imageTargetSrc: ./phyar-16-kad.mind; autoStart: false; uiLoading: no; uiScanning: no; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001"
    renderer="colorManagement: true; alpha: true; antialias: true; precision: high"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity light="type: ambient; intensity: 1.1"></a-entity>
    <a-entity light="type: directional; intensity: 1.3" position="0.5 1 1.5"></a-entity>
    <a-entity mindar-image-target="targetIndex: 0"  phyar-card="index: 0"></a-entity>
    <a-entity mindar-image-target="targetIndex: 1"  phyar-card="index: 1"></a-entity>
    <a-entity mindar-image-target="targetIndex: 2"  phyar-card="index: 2"></a-entity>
    <a-entity mindar-image-target="targetIndex: 3"  phyar-card="index: 3"></a-entity>
    <a-entity mindar-image-target="targetIndex: 4"  phyar-card="index: 4"></a-entity>
    <a-entity mindar-image-target="targetIndex: 5"  phyar-card="index: 5"></a-entity>
    <a-entity mindar-image-target="targetIndex: 6"  phyar-card="index: 6"></a-entity>
    <a-entity mindar-image-target="targetIndex: 7"  phyar-card="index: 7"></a-entity>
    <a-entity mindar-image-target="targetIndex: 8"  phyar-card="index: 8"></a-entity>
    <a-entity mindar-image-target="targetIndex: 9"  phyar-card="index: 9"></a-entity>
    <a-entity mindar-image-target="targetIndex: 10" phyar-card="index: 10"></a-entity>
    <a-entity mindar-image-target="targetIndex: 11" phyar-card="index: 11"></a-entity>
    <a-entity mindar-image-target="targetIndex: 12" phyar-card="index: 12"></a-entity>
    <a-entity mindar-image-target="targetIndex: 13" phyar-card="index: 13"></a-entity>
    <a-entity mindar-image-target="targetIndex: 14" phyar-card="index: 14"></a-entity>
    <a-entity mindar-image-target="targetIndex: 15" phyar-card="index: 15"></a-entity>
  </a-scene>

  <script>
    ["title", "loading", "hint", "frame", "progress", "hotspots", "bubble", "simPanel", "dT", "dTlabel", "dTval", "dTinfo",
     "resetBtn", "quizBtn", "labelBtn", "soundBtn", "sheet", "toast", "collection", "collectionBtn"]
      .forEach((id) => (UI[id] = document.getElementById(id)));
    const scene = document.querySelector("a-scene");
    updateProgressUI();

    function startAR() {
      document.getElementById("start").style.display = "none";
      const go = () => scene.systems["mindar-image-system"].start();
      if (scene.hasLoaded) go(); else scene.addEventListener("loaded", go, { once: true });
    }
    document.getElementById("startBtn").addEventListener("click", startAR);

    UI.soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      allVideos.forEach((v) => (v.muted = !soundOn));
      UI.soundBtn.textContent = soundOn ? "🔊" : "🔇";
      UI.soundBtn.classList.toggle("on", soundOn);
    });
    UI.labelBtn.addEventListener("click", () => {
      labelsOn = !labelsOn; UI.labelBtn.classList.toggle("on", labelsOn);
      if (!labelsOn) UI.bubble.classList.add("hidden");
    });
    UI.resetBtn.addEventListener("click", () => { if (activeCard) { activeCard.userRot = 0; activeCard.userScale = 1; } });
    UI.quizBtn.addEventListener("click", () => { if (activeCard) activeCard.startQuiz(); });
    UI.dT.addEventListener("input", () => {
      updateSimText(UI.dT.value);
      if (activeCard && activeCard.sim) activeCard.sim.setDT(+UI.dT.value);
    });
    UI.bubble.addEventListener("click", () => UI.bubble.classList.add("hidden"));

    /* ---------- collection screen ---------- */
    function openCollection() {
      const n = progress.found.length;
      UI.collection.querySelector(".box").innerHTML =
        "<h3>🃏 Koleksi Kad Saya</h3><p style='margin:0 0 6px'>" + n + "/" + CARDS.length + " kad dijumpai · ⭐ " + totalStars() + "</p>" +
        '<div class="bar"><i style="width:' + (100 * n / CARDS.length) + '%"></i></div>' +
        '<div class="grid">' + CARDS.map((c, i) => {
          const f = progress.found.includes(i);
          return '<div class="slot' + (f ? " found" : "") + '"><span class="n">' + (f ? "✓" : "🔒") + "</span>" +
            (f ? c.title : "Kad " + (i + 1)) + "</div>";
        }).join("") + "</div>" +
        (TOPICS.length ? "<b>🏅 Lencana</b><div class='badges' style='margin:6px 0 14px'>" +
          TOPICS.map((t) => '<span class="badge' + (topicDone(t) ? "" : " locked") + '">' + (topicDone(t) ? "🏅 " : "🔒 ") + "Pakar " + t + "</span>").join("") +
          "</div>" : "") +
        '<button class="big next" id="closeCol">Tutup</button>';
      UI.collection.classList.remove("hidden");
      document.getElementById("closeCol").addEventListener("click", () => UI.collection.classList.add("hidden"));
    }
    UI.collectionBtn.addEventListener("click", openCollection);
    UI.progress.addEventListener("click", openCollection);
  </script>
</body>
</html>
