<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>PhyAR Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --green: #23a05a; --green-d: #157a40; --green-l: #dff5e6;
      --navy: #17233d; --yellow: #ffd23f; --white: #ffffff;
    }
    /* No page background: the live camera sits behind the page and must stay visible. */
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: transparent;
      font-family: "Baloo 2", system-ui, sans-serif; color: var(--navy);
      -webkit-user-select: none; user-select: none; touch-action: none;
    }

    /* ---------- start screen ---------- */
    #start {
      position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
      background: radial-gradient(circle at 30% 20%, #8fe0a8 0%, #2fae63 45%, #157a40 100%);
      color: var(--white);
    }
    #start .logo { font-size: 58px; font-weight: 800; line-height: 1; letter-spacing: -1px;
      text-shadow: 0 4px 0 var(--navy), 0 8px 18px rgba(0,0,0,.25); }
    #start .logo span { color: var(--yellow); }
    #start .sub { margin-top: 10px; font-size: 18px; font-weight: 600; opacity: .95; }
    #start .cardicon {
      width: 120px; height: 160px; margin: 34px auto 30px; border-radius: 18px;
      background: var(--white); border: 5px solid var(--navy); position: relative;
      box-shadow: 0 10px 0 rgba(0,0,0,.18); animation: float 2.6s ease-in-out infinite;
    }
    #start .cardicon::before { content: ""; position: absolute; left: 14px; right: 14px; top: 16px;
      height: 62px; border-radius: 10px; background: linear-gradient(#bfe6ff, #e6f6ff); }
    #start .cardicon::after { content: "))"; position: absolute; left: 34px; top: 28px;
      font-size: 34px; font-weight: 800; color: #1a59e6; letter-spacing: -4px; }
    #start .lines { position: absolute; left: 14px; right: 14px; bottom: 18px; }
    #start .lines i { display: block; height: 8px; border-radius: 4px; background: var(--green-l); margin-top: 7px; }
    #start .lines i:nth-child(2) { width: 70%; }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10px) rotate(4deg); } }
    #startBtn {
      font-family: inherit; font-size: 24px; font-weight: 800; color: var(--navy);
      padding: 14px 44px; border: 4px solid var(--navy); border-radius: 999px;
      background: var(--yellow); box-shadow: 0 6px 0 var(--navy); cursor: pointer;
    }
    #startBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--navy); }
    #start .note { margin-top: 18px; font-size: 14px; opacity: .85; }

    /* ---------- in-AR interface ---------- */
    .pill {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
      padding: 8px 18px; border-radius: 999px; font-weight: 700; white-space: nowrap;
      border: 3px solid var(--navy); box-shadow: 0 4px 0 rgba(23,35,61,.35);
      transition: opacity .3s, transform .3s; pointer-events: none;
    }
    .hidden { opacity: 0 !important; transform: translateX(-50%) translateY(-8px) !important; }
    #title { top: max(16px, env(safe-area-inset-top)); background: var(--white); font-size: 18px;
      max-width: calc(100% - 48px); overflow: hidden; text-overflow: ellipsis; }
    #hint { bottom: 104px; background: var(--green); color: var(--white); font-size: 16px; }
    #loading { top: 50%; background: var(--white); font-size: 16px; }
    #loading::before { content: ""; display: inline-block; width: 14px; height: 14px; margin-right: 8px;
      border: 3px solid var(--green); border-top-color: transparent; border-radius: 50%;
      vertical-align: -2px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* scanning frame */
    #frame { position: fixed; z-index: 15; left: 50%; top: 46%; width: 56vw; max-width: 260px;
      aspect-ratio: 2 / 3; transform: translate(-50%, -50%); pointer-events: none; transition: opacity .3s; }
    #frame i { position: absolute; width: 34px; height: 34px; border: 6px solid var(--white);
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); animation: pulse 1.6s ease-in-out infinite; }
    #frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
    #frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 14px 0 0; }
    #frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 14px; }
    #frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

    #bar { position: fixed; z-index: 20; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom));
      display: flex; justify-content: center; gap: 14px; }
    .btn { font-family: inherit; width: 62px; height: 62px; border-radius: 50%; font-size: 26px;
      border: 4px solid var(--navy); background: var(--white); box-shadow: 0 5px 0 var(--navy);
      display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--navy); }
    .btn.on { background: var(--yellow); }
    #resetBtn { display: none; }
  </style>

  <script>
    /* ==================================================================
       TETAPAN KAD  (edit di sini sahaja)
       Susunan mesti SAMA dengan susunan gambar semasa compile phyar-16-kad.mind

       title  : tajuk kecil yang muncul di atas skrin bila kad diimbas
       video  : fail video (kosongkan "" jika tiada video)
       key    : "green" = buang latar hijau | "black" = buang latar hitam | "none" = biar
       model  : fail 3D .glb (kosongkan "" jika tiada) - pelajar boleh pusing & zum
       motion : gerakan model: "none" | "bob" (melambung) | "spin" (berpusing) | "slide" (gelongsor)
       scale  : saiz video (1 = selebar kad)
       y      : naik/turun video atas kad (+ naik, - turun)
       ================================================================== */
    const CARDS = [
      { title: "", video: "video-01.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-02.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-03.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-04.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-05.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-06.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-07.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-08.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-09.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-10.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-11.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-12.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "Pembiasan Bunyi · Waktu Siang", video: "video-13.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-14.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-15.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
      { title: "", video: "video-16.mp4", key: "black", model: "", motion: "none", scale: 1, y: 0.05 },
    ];

    /* Kekuatan buang latar. Naikkan jika latar masih kelihatan;
       turunkan jika bahagian objek ikut hilang. */
    const GREEN_CUT = 0.08;
    const BLACK_CUT = 0.07;
    const MODEL_SIZE = 0.8;   // saiz model 3D berbanding lebar kad

    /* ------------------------------------------------------------------ */
    const UI = {};
    let soundOn = true;
    let activeCard = null;
    const allVideos = [];

    function setTitle(text) {
      UI.title.textContent = text || "";
      UI.title.classList.toggle("hidden", !text);
    }
    function setLoading(on) { UI.loading.classList.toggle("hidden", !on); }
    function setScanning(on) {
      UI.hint.classList.toggle("hidden", !on);
      UI.frame.style.opacity = on ? 1 : 0;
    }

    const VERT = `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
    const FRAG = `
      uniform sampler2D map;
      uniform float keyMode, greenCut, blackCut, aspect, opacity;
      varying vec2 vUv;
      void main() {
        vec4 c = texture2D(map, vUv);
        float a = 1.0;
        if (keyMode > 0.5 && keyMode < 1.5) {            // green screen
          float g = c.g - max(c.r, c.b);
          a = 1.0 - smoothstep(greenCut, greenCut + 0.12, g);
          if (g > 0.0) c.g = mix(c.g, max(c.r, c.b), 0.85);
        } else if (keyMode > 1.5) {                       // black background
          float l = max(c.r, max(c.g, c.b));
          a = smoothstep(blackCut, blackCut + 0.10, l);
        }
        // soft rounded corners so the video looks like a cute sticker
        vec2 p = abs(vUv - 0.5) * vec2(aspect, 1.0);
        vec2 h = vec2(aspect, 1.0) * 0.5 - 0.06;
        float d = length(max(p - h, 0.0)) - 0.06;
        a *= 1.0 - smoothstep(-0.004, 0.004, d);
        a *= opacity;
        if (a < 0.02) discard;
        gl_FragColor = vec4(c.rgb, a);
      }`;

    const easeOutBack = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

    AFRAME.registerComponent("phyar-card", {
      schema: { index: { type: "int" } },

      init: function () {
        this.cfg = CARDS[this.data.index] || {};
        this.visible = false;
        this.popT = 1;
        this.userRot = 0;
        this.userScale = 1;
        this.clock = 0;

        this.holder = new THREE.Group();          // pop-in animation
        this.holder.visible = false;
        this.el.object3D.add(this.holder);

        if (this.cfg.video) this.buildVideo();
        if (this.cfg.model) {
          this.turn = new THREE.Group();          // user rotation + motion
          this.holder.add(this.turn);
        }

        this.el.addEventListener("targetFound", () => this.onFound());
        this.el.addEventListener("targetLost", () => this.onLost());
      },

      buildVideo: function () {
        const cfg = this.cfg;
        const v = document.createElement("video");
        v.src = cfg.video;
        v.loop = true; v.muted = !soundOn; v.playsInline = true;
        v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
        v.crossOrigin = "anonymous"; v.preload = "none";
        allVideos.push(v);
        this.video = v;

        const tex = new THREE.VideoTexture(v);
        tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
        tex.generateMipmaps = false;
        const r = this.el.sceneEl.renderer;
        if (r) tex.anisotropy = r.capabilities.getMaxAnisotropy();

        const keyMode = cfg.key === "green" ? 1 : cfg.key === "black" ? 2 : 0;
        this.vmat = new THREE.ShaderMaterial({
          transparent: true, side: THREE.DoubleSide, depthWrite: false,
          uniforms: {
            map: { value: tex }, keyMode: { value: keyMode },
            greenCut: { value: GREEN_CUT }, blackCut: { value: BLACK_CUT },
            aspect: { value: 16 / 9 }, opacity: { value: 1 },
          },
          vertexShader: VERT, fragmentShader: FRAG,
        });
        this.vplane = new THREE.Mesh(new THREE.PlaneGeometry(1, 9 / 16), this.vmat);
        this.vplane.position.set(0, cfg.y || 0, 0.005);
        this.vbase = cfg.scale || 1;
        this.vplane.scale.setScalar(this.vbase);
        this.holder.add(this.vplane);

        v.addEventListener("loadedmetadata", () => {
          if (!v.videoWidth) return;
          const asp = v.videoWidth / v.videoHeight;
          this.vplane.geometry.dispose();
          this.vplane.geometry = new THREE.PlaneGeometry(1, 1 / asp);
          this.vmat.uniforms.aspect.value = asp;
        });
        v.addEventListener("waiting", () => { if (this.visible) setLoading(true); });
        v.addEventListener("playing", () => setLoading(false));
      },

      loadModel: function () {
        if (this.modelLoading || this.model) return;
        this.modelLoading = true;
        setLoading(true);
        const loader = new THREE.GLTFLoader();
        loader.load(this.cfg.model, (gltf) => {
          const m = gltf.scene;
          // fit the model to the card and stand it upright on the card
          const box = new THREE.Box3().setFromObject(m);
          const size = new THREE.Vector3(); box.getSize(size);
          const centre = new THREE.Vector3(); box.getCenter(centre);
          const s = MODEL_SIZE / Math.max(size.x, size.z, 0.0001);
          m.position.set(-centre.x * s, -box.min.y * s, -centre.z * s);
          m.scale.setScalar(s);
          const stand = new THREE.Group();
          stand.rotation.x = Math.PI / 2;           // model "up" points out of the card
          stand.add(m);
          this.turn.add(stand);
          if (gltf.animations && gltf.animations.length) {
            this.mixer = new THREE.AnimationMixer(m);
            gltf.animations.forEach((clip) => this.mixer.clipAction(clip).play());
          }
          this.model = m;
          setLoading(false);
        }, undefined, (err) => {
          console.error("Model gagal dimuat:", this.cfg.model, err);
          setLoading(false);
        });
      },

      onFound: function () {
        this.visible = true;
        activeCard = this;
        this.holder.visible = true;
        this.popT = 0;
        setScanning(false);
        setTitle(this.cfg.title);
        UI.resetBtn.style.display = this.cfg.model ? "flex" : "none";
        if (this.video) {
          this.video.muted = !soundOn;
          if (this.video.readyState < 3) setLoading(true);
          this.video.play().catch(() => {});
        }
        if (this.cfg.model) this.loadModel();
      },

      onLost: function () {
        this.visible = false;
        this.holder.visible = false;
        if (this.video) this.video.pause();
        if (activeCard === this) {
          activeCard = null;
          setTitle("");
          setLoading(false);
          setScanning(true);
          UI.resetBtn.style.display = "none";
        }
      },

      tick: function (t, dt) {
        if (!this.visible) return;
        const sec = (dt || 16) / 1000;
        this.clock += sec;

        // bouncy pop-in when the card is found
        if (this.popT < 1) {
          this.popT = Math.min(1, this.popT + sec / 0.45);
          this.holder.scale.setScalar(Math.max(0.001, easeOutBack(this.popT)));
        }
        if (this.vplane) this.vplane.scale.setScalar(this.vbase * this.userScale);

        if (this.turn) {
          let rot = this.userRot, x = 0, lift = 0;
          const mo = this.cfg.motion;
          if (mo === "spin") rot += this.clock * 0.8;
          if (mo === "bob") lift = 0.03 + Math.sin(this.clock * 3) * 0.03;
          if (mo === "slide") x = Math.sin(this.clock * 0.9) * 0.25;
          this.turn.rotation.z = rot;
          this.turn.position.set(x, 0, lift);
          this.turn.scale.setScalar(this.userScale);
        }
        if (this.mixer) this.mixer.update(sec);
      },
    });

    /* ---------- touch: drag to rotate, pinch to zoom ---------- */
    (function () {
      const pts = new Map();
      let lastX = 0, startDist = 0, startScale = 1;
      const isUI = (e) => e.target.closest && e.target.closest("button, #start");
      window.addEventListener("pointerdown", (e) => {
        if (isUI(e)) return;
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        lastX = e.clientX;
        if (pts.size === 2 && activeCard) {
          const [a, b] = [...pts.values()];
          startDist = Math.hypot(a.x - b.x, a.y - b.y);
          startScale = activeCard.userScale;
        }
      });
      window.addEventListener("pointermove", (e) => {
        if (!pts.has(e.pointerId)) return;
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (!activeCard) return;
        if (pts.size === 1 && activeCard.turn) {
          activeCard.userRot += (e.clientX - lastX) * 0.012;
          lastX = e.clientX;
        } else if (pts.size === 2 && startDist > 0) {
          const [a, b] = [...pts.values()];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          activeCard.userScale = Math.min(2.5, Math.max(0.5, startScale * d / startDist));
        }
      });
      const up = (e) => { pts.delete(e.pointerId); if (pts.size === 1) lastX = [...pts.values()][0].x; };
      window.addEventListener("pointerup", up);
      window.addEventListener("pointercancel", up);
    })();
  </script>
</head>

<body>
  <!-- start screen (the tap also lets phones play sound) -->
  <div id="start">
    <div class="logo">Phy<span>AR</span><br />Deck</div>
    <div class="sub">Gelombang · Fizik Tingkatan 4</div>
    <div class="cardicon"><div class="lines"><i></i><i></i></div></div>
    <button id="startBtn">Mula Imbas ▶</button>
    <div class="note">Benarkan akses kamera bila diminta</div>
  </div>

  <div id="frame"><i></i><i></i><i></i><i></i></div>
  <div id="title" class="pill hidden"></div>
  <div id="loading" class="pill hidden">Memuatkan…</div>
  <div id="hint" class="pill">Halakan kamera ke kad PhyAR 📱</div>

  <div id="bar">
    <button id="soundBtn" class="btn on" aria-label="Bunyi">🔊</button>
    <button id="resetBtn" class="btn" aria-label="Set semula">↺</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./phyar-16-kad.mind; autoStart: false; uiLoading: no; uiScanning: no; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001"
    renderer="colorManagement: true; alpha: true; antialias: true; precision: high"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity light="type: ambient; intensity: 1.1"></a-entity>
    <a-entity light="type: directional; intensity: 1.3" position="0.5 1 1.5"></a-entity>

    <a-entity mindar-image-target="targetIndex: 0"  phyar-card="index: 0"></a-entity>
    <a-entity mindar-image-target="targetIndex: 1"  phyar-card="index: 1"></a-entity>
    <a-entity mindar-image-target="targetIndex: 2"  phyar-card="index: 2"></a-entity>
    <a-entity mindar-image-target="targetIndex: 3"  phyar-card="index: 3"></a-entity>
    <a-entity mindar-image-target="targetIndex: 4"  phyar-card="index: 4"></a-entity>
    <a-entity mindar-image-target="targetIndex: 5"  phyar-card="index: 5"></a-entity>
    <a-entity mindar-image-target="targetIndex: 6"  phyar-card="index: 6"></a-entity>
    <a-entity mindar-image-target="targetIndex: 7"  phyar-card="index: 7"></a-entity>
    <a-entity mindar-image-target="targetIndex: 8"  phyar-card="index: 8"></a-entity>
    <a-entity mindar-image-target="targetIndex: 9"  phyar-card="index: 9"></a-entity>
    <a-entity mindar-image-target="targetIndex: 10" phyar-card="index: 10"></a-entity>
    <a-entity mindar-image-target="targetIndex: 11" phyar-card="index: 11"></a-entity>
    <a-entity mindar-image-target="targetIndex: 12" phyar-card="index: 12"></a-entity>
    <a-entity mindar-image-target="targetIndex: 13" phyar-card="index: 13"></a-entity>
    <a-entity mindar-image-target="targetIndex: 14" phyar-card="index: 14"></a-entity>
    <a-entity mindar-image-target="targetIndex: 15" phyar-card="index: 15"></a-entity>
  </a-scene>

  <script>
    ["title", "loading", "hint", "frame", "resetBtn"].forEach((id) => (UI[id] = document.getElementById(id)));
    const scene = document.querySelector("a-scene");
    const soundBtn = document.getElementById("soundBtn");

    function startAR() {
      document.getElementById("start").style.display = "none";
      const go = () => scene.systems["mindar-image-system"].start();
      if (scene.hasLoaded) go(); else scene.addEventListener("loaded", go, { once: true });
    }
    document.getElementById("startBtn").addEventListener("click", startAR);

    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      allVideos.forEach((v) => (v.muted = !soundOn));
      soundBtn.textContent = soundOn ? "🔊" : "🔇";
      soundBtn.classList.toggle("on", soundOn);
    });

    UI.resetBtn.addEventListener("click", () => {
      if (activeCard) { activeCard.userRot = 0; activeCard.userScale = 1; }
    });
  </script>
</body>
</html>
