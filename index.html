<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>PhyAR Deck</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #soundBtn {
      position: fixed; z-index: 10; right: 16px; bottom: 24px;
      padding: 12px 18px; border: none; border-radius: 999px;
      background: #2e9e5b; color: #fff; font-size: 16px; font-weight: 700;
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
    }
    #hint {
      position: fixed; z-index: 10; left: 0; right: 0; top: 16px; text-align: center;
      color: #fff; font-size: 15px; text-shadow: 0 1px 4px #000; pointer-events: none;
    }
  </style>

  <script>
    /* =========================================================
       TETAPAN KAD (edit di sini sahaja)
       - Susunan mesti SAMA dengan susunan gambar kad semasa
         anda compile phyar-16-kad.mind (kad pertama = 1).
       - video : nama fail video yang anda upload ke GitHub
       - green : true jika video ada latar hijau (Google Flow green screen)
       - scale : saiz video (1 = selebar kad)
       - y     : naik/turun video atas kad (+ naik, - turun)
       ========================================================= */
    const CARDS = [
      { video: "video-01.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-02.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-03.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-04.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-05.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-06.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-07.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-08.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-09.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-10.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-11.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-12.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-13.mp4", green: true, scale: 1, y: 0.05 }, // Pembiasan Bunyi - Waktu Siang
      { video: "video-14.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-15.mp4", green: true, scale: 1, y: 0.05 },
      { video: "video-16.mp4", green: true, scale: 1, y: 0.05 },
    ];

    /* Kekuatan buang latar hijau. Naikkan GREEN_CUT jika masih ada hijau;
       turunkan jika objek ikut hilang. */
    const GREEN_CUT = 0.08;
    const GREEN_SOFT = 0.12;

    const allVideos = [];

    AFRAME.registerComponent("video-card", {
      schema: { index: { type: "int" } },

      init: function () {
        const cfg = CARDS[this.data.index];
        if (!cfg) return;

        // video element (muted + playsinline so phones allow autoplay)
        const v = document.createElement("video");
        v.src = cfg.video;
        v.loop = true;
        v.muted = true;
        v.playsInline = true;
        v.setAttribute("playsinline", "");
        v.setAttribute("webkit-playsinline", "");
        v.crossOrigin = "anonymous";
        v.preload = "none";            // only download when the card is scanned
        allVideos.push(v);
        this.video = v;

        const tex = new THREE.VideoTexture(v);
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.generateMipmaps = false;

        const mat = new THREE.ShaderMaterial({
          transparent: true,
          side: THREE.DoubleSide,
          uniforms: {
            map: { value: tex },
            keyOn: { value: cfg.green ? 1.0 : 0.0 },
            cut: { value: GREEN_CUT },
            soft: { value: GREEN_SOFT },
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }`,
          fragmentShader: `
            uniform sampler2D map;
            uniform float keyOn, cut, soft;
            varying vec2 vUv;
            void main() {
              vec4 c = texture2D(map, vUv);
              float a = 1.0;
              if (keyOn > 0.5) {
                float greenness = c.g - max(c.r, c.b);
                a = 1.0 - smoothstep(cut, cut + soft, greenness);
                if (greenness > 0.0) c.g = mix(c.g, max(c.r, c.b), 0.8); // remove green fringe
              }
              if (a < 0.02) discard;
              gl_FragColor = vec4(c.rgb, a);
            }`,
        });

        // start as 16:9 (Google Flow landscape); fixed automatically once the video loads
        this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 9 / 16), mat);
        this.mesh.scale.set(cfg.scale, cfg.scale, cfg.scale);
        this.mesh.position.set(0, cfg.y, 0.01);
        this.mesh.visible = false;
        this.el.setObject3D("mesh", this.mesh);

        v.addEventListener("loadedmetadata", () => {
          if (v.videoWidth) {
            this.mesh.geometry.dispose();
            this.mesh.geometry = new THREE.PlaneGeometry(1, v.videoHeight / v.videoWidth);
          }
        });

        this.el.addEventListener("targetFound", () => {
          this.mesh.visible = true;
          v.play().catch(() => {});
          document.getElementById("hint").style.display = "none";
        });
        this.el.addEventListener("targetLost", () => {
          this.mesh.visible = false;
          v.pause();
        });
      },
    });
  </script>
</head>

<body>
  <div id="hint">Halakan kamera ke kad PhyAR</div>
  <button id="soundBtn">🔇 Bunyi</button>

  <a-scene
    mindar-image="imageTargetSrc: ./phyar-16-kad.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0"  video-card="index: 0"></a-entity>
    <a-entity mindar-image-target="targetIndex: 1"  video-card="index: 1"></a-entity>
    <a-entity mindar-image-target="targetIndex: 2"  video-card="index: 2"></a-entity>
    <a-entity mindar-image-target="targetIndex: 3"  video-card="index: 3"></a-entity>
    <a-entity mindar-image-target="targetIndex: 4"  video-card="index: 4"></a-entity>
    <a-entity mindar-image-target="targetIndex: 5"  video-card="index: 5"></a-entity>
    <a-entity mindar-image-target="targetIndex: 6"  video-card="index: 6"></a-entity>
    <a-entity mindar-image-target="targetIndex: 7"  video-card="index: 7"></a-entity>
    <a-entity mindar-image-target="targetIndex: 8"  video-card="index: 8"></a-entity>
    <a-entity mindar-image-target="targetIndex: 9"  video-card="index: 9"></a-entity>
    <a-entity mindar-image-target="targetIndex: 10" video-card="index: 10"></a-entity>
    <a-entity mindar-image-target="targetIndex: 11" video-card="index: 11"></a-entity>
    <a-entity mindar-image-target="targetIndex: 12" video-card="index: 12"></a-entity>
    <a-entity mindar-image-target="targetIndex: 13" video-card="index: 13"></a-entity>
    <a-entity mindar-image-target="targetIndex: 14" video-card="index: 14"></a-entity>
    <a-entity mindar-image-target="targetIndex: 15" video-card="index: 15"></a-entity>
  </a-scene>

  <script>
    // Phones only allow sound after a tap, so videos start muted.
    const btn = document.getElementById("soundBtn");
    let soundOn = false;
    btn.addEventListener("click", () => {
      soundOn = !soundOn;
      allVideos.forEach((v) => { v.muted = !soundOn; });
      btn.textContent = soundOn ? "🔊 Bunyi" : "🔇 Bunyi";
    });
  </script>
</body>
</html>
